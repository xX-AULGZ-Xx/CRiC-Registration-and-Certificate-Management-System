services:
  # ----------------------------------------------------------------------------
  # MySQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: cric-cert-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-plan_root_password}
      MYSQL_DATABASE: ${DB_NAME:-registration_certificate_db}
      MYSQL_USER: ${DB_USER:-plan_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-plan_password}
    ports:
      - "${DATABASE_PORT_MAPPING:-3308}:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - cric-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-plan_root_password}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ----------------------------------------------------------------------------
  # Backend Express API Service
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: cric-cert-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5060
      DATABASE_URL: mysql://${DB_USER:-plan_user}:${DB_PASSWORD:-plan_password}@db:3306/${DB_NAME:-registration_certificate_db}
      JWT_SECRET: ${JWT_SECRET:-reg-cert-mgmt-system-secret-key-2026-chiangrai}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3006,http://localhost:3000,http://127.0.0.1:3006}
      STORAGE_DIR: /app/storage
      APP_URL: ${APP_URL:-http://localhost:3006}
    ports:
      - "${API_PORT_MAPPING:-5060}:5060"
    volumes:
      - storage_data:/app/storage
    networks:
      - cric-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5060/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------------------------
  # Frontend Next.js Web Service
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        INTERNAL_API_URL: http://api:5060
    container_name: cric-cert-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3006
      INTERNAL_API_URL: http://api:5060
    ports:
      - "${WEB_PORT_MAPPING:-3006}:3006"
    networks:
      - cric-network

# ------------------------------------------------------------------------------
# Persistent Volumes & Network
# ------------------------------------------------------------------------------
volumes:
  db_data:
    name: cric-cert-db-data
  storage_data:
    name: cric-cert-storage-data

networks:
  cric-network:
    name: cric-cert-network
    driver: bridge
